<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Billing</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="#">Smart Inventory</a>
<div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="customers.html">Customers</a></li>
<li class="nav-item"><a class="nav-link active" href="billing.html">Billing</a></li></ul>
<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></div></nav>
<div class="container mt-4"><h2>Billing</h2>
<div class="row"><div class="col-md-8">
<div class="card mb-3"><div class="card-body">
<div class="row"><div class="col-md-6 mb-3"><label>Customer</label><select id="invoiceCustomer" class="form-select"></select></div>
<div class="col-md-6 mb-3"><label>Product</label><select id="invoiceProduct" class="form-select"></select></div></div>
<div class="row"><div class="col-md-4 mb-3"><label>Qty</label><input type="number" id="invoiceQty" class="form-control" value="1" min="1"></div>
<div class="col-md-4 d-flex align-items-end"><button class="btn btn-secondary w-100" onclick="addToCart()">Add to Cart</button></div></div></div></div>
<div class="card"><div class="card-header">Items</div><div class="card-body"><table class="table"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th>Action</th></tr></thead>
<tbody id="cartBody"></tbody></table><h3 class="text-end">Total: $<span id="grandTotal">0.00</span></h3><div class="text-end mt-3"><button class="btn btn-success btn-lg" onclick="finalizeInvoice()">Finalize</button></div></div></div></div>
<div class="col-md-4"><div class="card"><div class="card-header">Recent</div><ul class="list-group list-group-flush" id="recentInvoicesList"></ul></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
