<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5"><div class="row justify-content-center"><div class="col-md-4">
<div class="card shadow"><div class="card-header bg-primary text-white text-center"><h4>Smart Inventory Login</h4></div>
<div class="card-body"><form id="loginForm"><div class="mb-3"><label>Username</label><input type="text" id="username" class="form-control" required></div>
<div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" required></div>
<div id="errorAlert" class="alert alert-danger d-none">Invalid credentials</div>
<button type="submit" class="btn btn-primary w-100">Login</button></form></div></div></div></div></div>
<script src="js/api.js"></script><script src="js/app.js"></script></body></html>
