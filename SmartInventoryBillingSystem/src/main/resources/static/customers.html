<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Customers</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="#">Smart Inventory</a>
<div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link active" href="customers.html">Customers</a></li>
<li class="nav-item"><a class="nav-link" href="billing.html">Billing</a></li></ul>
<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></div></nav>
<div class="container mt-4">
<div class="d-flex justify-content-between mb-3"><h2>Customers</h2><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#customerModal">Add Customer</button></div>
<div class="card shadow-sm"><div class="card-body"><table class="table table-striped"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th></tr></thead>
<tbody id="customerTableBody"></tbody></table></div></div></div>
<div class="modal fade" id="customerModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Add Customer</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><form id="customerForm"><div class="mb-3"><label>Name</label><input type="text" class="form-control" id="cName" required></div>
<div class="mb-3"><label>Email</label><input type="email" class="form-control" id="cEmail" required></div><div class="mb-3"><label>Phone</label><input type="text" class="form-control" id="cPhone" required></div>
<div class="mb-3"><label>Address</label><input type="text" class="form-control" id="cAddress" required></div></form></div>
<div class="modal-footer"><button class="btn btn-primary" onclick="saveCustomer()">Save</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
