<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Products</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="#">Smart Inventory</a>
<div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
<li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="customers.html">Customers</a></li><li class="nav-item"><a class="nav-link" href="billing.html">Billing</a></li></ul>
<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></div></nav>
<div class="container mt-4">
<div class="d-flex justify-content-between mb-3"><h2>Products</h2><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAddModal()">Add Product</button></div>
<div class="card shadow-sm"><div class="card-body"><table class="table table-striped"><thead><tr><th>ID</th><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Category</th><th>Actions</th></tr></thead>
<tbody id="productTableBody"></tbody></table></div></div></div>
<div class="modal fade" id="productModal"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="modalTitle">Add Product</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><form id="productForm"><input type="hidden" id="productId"><div class="mb-3"><label>Name</label><input type="text" class="form-control" id="pName" required></div>
<div class="mb-3"><label>SKU</label><input type="text" class="form-control" id="pSku" required></div><div class="mb-3"><label>Price</label><input type="number" step="0.01" class="form-control" id="pPrice" required></div>
<div class="mb-3"><label>Stock</label><input type="number" class="form-control" id="pStock" required></div><div class="mb-3"><label>Category</label><input type="text" class="form-control" id="pCategory" required></div></form></div>
<div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-primary" onclick="saveProduct()">Save</button></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/app.js"></script></body></html>
