<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="#">Smart Inventory</a>
<div class="collapse navbar-collapse"><ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
<li class="nav-item"><a class="nav-link" href="products.html">Products</a></li><li class="nav-item"><a class="nav-link" href="customers.html">Customers</a></li><li class="nav-item"><a class="nav-link" href="billing.html">Billing</a></li></ul>
<button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button></div></div></nav>
<div class="container mt-4"><h2>Dashboard</h2>
<div class="row mt-4"><div class="col-md-3"><div class="card text-white bg-primary mb-3"><div class="card-body"><h5>Products</h5><p class="fs-3" id="statProducts">0</p></div></div></div>
<div class="col-md-3"><div class="card text-white bg-success mb-3"><div class="card-body"><h5>Revenue</h5><p class="fs-3" id="statRevenue">$0</p></div></div></div>
<div class="col-md-3"><div class="card text-white bg-warning mb-3"><div class="card-body"><h5>Low Stock</h5><p class="fs-3" id="statLowStock">0</p></div></div></div>
<div class="col-md-3"><div class="card text-white bg-info mb-3"><div class="card-body"><h5>Invoices</h5><p class="fs-3" id="statInvoices">0</p></div></div></div></div>
<div class="row mt-4"><div class="col-md-6"><div class="card shadow-sm"><div class="card-header">Sales</div><div class="card-body"><canvas id="salesChart"></canvas></div></div></div>
<div class="col-md-6"><div class="card shadow-sm"><div class="card-header">Inventory</div><div class="card-body"><canvas id="inventoryChart"></canvas></div></div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="js/api.js"></script><script src="js/charts.js"></script><script src="js/app.js"></script></body></html>
